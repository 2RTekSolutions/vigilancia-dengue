[project]
name = "vigilancia-dengue"
version = "0.1.0"
description = "FAROL: vigilância da dengue com dado público, para qualquer município"
readme = "README.md"
authors = [
    { name = "Renan Croffi", email = "renancroffi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
painel = [
    "kaleido>=1.5.0",
    "plotly>=7.1.0",
    "streamlit>=1.66.1",
]
[tool.pytest.ini_options]
pythonpath = ["src", "painel"]
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (erros)
    "W",   # pycodestyle (avisos)
    "F",   # pyflakes
    "I",   # isort (ordem dos imports)
    "UP",  # pyupgrade (sintaxe moderna)
    "B",   # flake8-bugbear (bugs comuns)
]

[tool.ruff.format]
quote-style = "double"
